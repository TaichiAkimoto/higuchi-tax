name: Mendoi
options:
  bundleIdPrefix: com.taichi
  deploymentTarget:
    iOS: 16.0

targets:
  Mendoi:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Mendoi
        excludes:
          - "**/*.md"
    info:
      path: Mendoi/Info.plist
      properties:
        CFBundleDisplayName: めんどい
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSpeechRecognitionUsageDescription: "やりたくないことを音声で入力するために使用します"
        NSMicrophoneUsageDescription: "音声認識のためにマイクを使用します"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taichi.mendoi
        INFOPLIST_FILE: Mendoi/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"

  MendoiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MendoiTests
    dependencies:
      - target: Mendoi
    settings:
      base:
        INFOPLIST_FILE: MendoiTests/Info.plist
